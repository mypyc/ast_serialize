[package]
name = "mypy_parser"
version = "0.7.0"
publish = false
authors = ["Jukka Lehtosalo"]
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Python extension that serializes Ruff AST for mypy"

[lib]
name = "ast_serialize"
crate-type = ["cdylib"]

# A workspace for building vendored Ruff crates.
# Note we copy workspace values from Ruff 0.15.12 verbatim.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93"
homepage = "https://docs.astral.sh/ruff"
documentation = "https://docs.astral.sh/ruff"
repository = "https://github.com/astral-sh/ruff"
authors = ["Charlie Marsh <charlie.r.marsh@gmail.com>"]
license = "MIT"

[workspace.dependencies]
aho-corasick = { version = "1.1.3" }
anstream = { version = "1.0.0" }
anstyle = { version = "1.0.10" }
anyhow = { version = "1.0.80" }
bitflags = { version = "2.5.0" }
bstr = { version = "1.9.1" }
compact_str = "0.9.0"
datatest-stable = { version = "0.3.3" }
filetime = { version = "0.2.23" }
get-size2 = { version = "0.8.0", features = [
    "derive",
    "smallvec",
    "hashbrown",
    "compact-str",
    "ordermap"
] }
glob = { version = "0.3.1" }
globset = { version = "0.4.14" }
heck = "0.5.0"
insta = { version = "1.35.1" }
is-macro = { version = "0.3.5" }
itertools = { version = "0.14.0" }
memchr = { version = "2.7.1" }
proc-macro2 = { version = "1.0.79" }
quote = { version = "1.0.23" }
regex = { version = "1.10.2" }
rustc-hash = { version = "2.0.0" }
salsa = { version="0.26.1", default-features = false, features = [
    "compact_str",
    "macros",
    "salsa_unstable",
    "inventory",
] }
schemars = { version = "1.0.4" }
seahash = { version = "4.1.0" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.113" }
serde_test = { version = "1.0.152" }
snapbox = { version = "1.0.0", features = [
    "diff",
    "term-svg",
    "cmd",
    "examples",
] }
static_assertions = "1.1.0"
syn = { version = "2.0.55" }
thiserror = { version = "2.0.0" }
toml = { version = "1.0.0" }
tryfn = { version = "1.0.0" }
unicode-ident = { version = "1.0.12" }
unicode-normalization = { version = "0.1.23" }
unicode-width = { version = "0.2.0" }
unicode_names2 = { version = "1.2.2" }
walkdir = { version = "2.3.2" }

# Cross-references between Ruff crates.
ruff_annotate_snippets = { path = "crates/ruff_annotate_snippets" }
ruff_cache = { path = "crates/ruff_cache" }
ruff_macros = { path = "crates/ruff_macros" }
ruff_python_ast = { path = "crates/ruff_python_ast" }
ruff_python_trivia = { path = "crates/ruff_python_trivia" }
ruff_source_file = { path = "crates/ruff_source_file" }
ruff_text_size = { path = "crates/ruff_text_size" }

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(fuzzing)",
    "cfg(codspeed)",
] }

[dependencies]
# PyO3 for Python bindings
# Base features always enabled; abi3-py39 is added via stable-abi feature
pyo3 = { version = "0.29.2", features = ["extension-module"] }

# Ruff dependencies for parsing Python (vendored, see above).
ruff_python_ast = { path = "crates/ruff_python_ast" }
ruff_python_parser = { path = "crates/ruff_python_parser" }
ruff_source_file = { path = "crates/ruff_source_file" }
ruff_text_size = { path = "crates/ruff_text_size" }

# Error handling
anyhow = "1.0"

# Hashing
sha1 = "0.10"

[dev-dependencies]
indoc = "2"

[features]
# Default: stable ABI for regular Python 3.9+
default = ["stable-abi"]
# Stable ABI wheels (cp39-abi3) - compatible with Python 3.9+
# Stable ABI wheels free-threaded (cp315-abit3t) - compatible with Python 3.15+
stable-abi = ["pyo3/abi3-py39", "pyo3/abi3t-py315"]
# Free-threaded Python wheels (cp313t) - for nogil Python
free-threaded = []
# Turn off rayon for profiling
singlethreaded = []

[lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
# Allowed pedantic lints (adjust based on your preferences)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Restriction lints
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
